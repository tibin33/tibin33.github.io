  const TYPE_META = {
    urgent: { label: '紧急截止', color: '#e5484d', bg: '#fdecec' },
    normal: { label: '常规通知', color: '#3b82f6', bg: '#eaf1fe' },
    party:  { label: '党团相关', color: '#22c55e', bg: '#e8f8ee' }
  };

  /* ---------- 日期工具 ---------- */
  function parseDate(str) {
    const parts = str.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function formatISO(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function addDays(str, n) {
    const d = parseDate(str);
    d.setDate(d.getDate() + n);
    return formatISO(d);
  }
  function formatCN(str) {
    const d = parseDate(str);
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function formatShort(str) {
    const d = parseDate(str);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  function deadlineOf(n) { return parseDate(n.end || n.start); }
  function isInProgress(n) {
    const s = parseDate(n.start);
    const e = deadlineOf(n);
    return today >= s && today <= e;
  }
  function daysToDeadline(n) {
    return Math.round((deadlineOf(n) - today) / 86400000);
  }
  function isUpcoming(n) {
    const d = daysToDeadline(n);
    return d >= 0 && d <= 3;
  }

  /* ---------- 渲染辅助 ---------- */
  function badgeHTML(n) {
    const m = TYPE_META[n.type];
    return '<span class="badge" style="background:' + m.bg + ';color:' + m.color + '">' + m.label + '</span>';
  }
  function remainChip(n) {
    const d = daysToDeadline(n);
    if (d === 0) return '<span class="chip chip-today">今天截止</span>';
    if (d === 1) return '<span class="chip chip-urgent">剩1天</span>';
    return '<span class="chip chip-urgent">剩' + d + '天</span>';
  }
  function rangeText(n) {
    return n.end ? formatShort(n.start) + ' – ' + formatShort(n.end) : formatShort(n.start);
  }

  /* ---------- 弹窗 ---------- */
  const overlay = document.getElementById('modal-overlay');
  const modalContent = document.getElementById('modal-content');

  function openModal() {
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  function showEventDetail(n) {
    const m = TYPE_META[n.type];
    const rangeRows = n.end
      ? '<div class="meta-row"><span class="meta-label">开始日期</span><span>' + formatCN(n.start) + '</span></div>' +
        '<div class="meta-row"><span class="meta-label">截止日期</span><span>' + formatCN(n.end) + '</span></div>'
      : '<div class="meta-row"><span class="meta-label">日期</span><span>' + formatCN(n.start) + '</span></div>';

    modalContent.innerHTML =
      '<div class="modal-head">' +
        '<h2>' + n.title + '</h2>' +
        badgeHTML(n) +
      '</div>' +
      '<div class="meta">' +
        rangeRows +
        '<div class="meta-row"><span class="meta-label">通知来源</span><span>' + n.source + '</span></div>' +
      '</div>' +
      '<div class="desc">' +
        '<div class="desc-label">需要做什么</div>' +
        '<p>' + n.description + '</p>' +
      '</div>';
    openModal();
  }

  function showDayEvents(dateStr) {
    const list = notices.filter(function (n) {
      const s = parseDate(n.start);
      const e = deadlineOf(n);
      const d = parseDate(dateStr);
      return d >= s && d <= e;
    });

    const body = list.length
      ? list.map(function (n) {
          const m = TYPE_META[n.type];
          return '<button class="day-event-item" data-id="' + n.id + '">' +
                   '<span class="dot" style="background:' + m.color + '"></span>' +
                   '<span class="day-event-title">' + n.title + '</span>' +
                   '<span class="day-event-meta">' + n.source + '</span>' +
                 '</button>';
        }).join('')
      : '<p class="empty">当天没有通知</p>';

    modalContent.innerHTML =
      '<div class="modal-head"><h2>' + formatCN(dateStr) + ' 的通知</h2></div>' +
      '<div class="day-list">' + body + '</div>';

    modalContent.querySelectorAll('.day-event-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const n = notices.find(function (x) { return x.id === Number(btn.dataset.id); });
        if (n) showEventDetail(n);
      });
    });
    openModal();
  }

  /* ---------- 侧栏列表 ---------- */
  function renderList(listEl, items, renderItem) {
    if (!items.length) {
      listEl.innerHTML = '<li class="empty">暂无相关通知</li>';
      return;
    }
    listEl.innerHTML = items.map(renderItem).join('');
    listEl.querySelectorAll('.notice-item').forEach(function (el) {
      el.addEventListener('click', function () {
        const n = notices.find(function (x) { return x.id === Number(el.dataset.id); });
        if (n) showEventDetail(n);
      });
    });
  }

  function itemHTML(n, opts) {
    opts = opts || {};
    return '<li class="notice-item type-' + n.type + '" data-id="' + n.id + '">' +
             '<div class="row1">' +
               '<span class="title">' + n.title + '</span>' +
               badgeHTML(n) +
             '</div>' +
             '<div class="meta">' +
               '<span>' + rangeText(n) + '</span>' +
               (opts.remain ? '<span>' + remainChip(n) + '</span>' : '') +
               '<span>· ' + n.source + '</span>' +
             '</div>' +
           '</li>';
  }

  function renderAll() {
    const inProgress = notices.filter(isInProgress);
    const upcoming = notices.filter(isUpcoming);
    const all = notices.slice().sort(function (a, b) {
      return parseDate(a.start) - parseDate(b.start);
    });

    renderList(document.getElementById('inprogress-list'), inProgress, function (n) { return itemHTML(n); });
    renderList(document.getElementById('deadline-list'), upcoming, function (n) { return itemHTML(n, { remain: true }); });
    renderList(document.getElementById('all-list'), all, function (n) { return itemHTML(n); });

    document.getElementById('inprogress-count').textContent = inProgress.length;
    document.getElementById('deadline-count').textContent = upcoming.length;
    document.getElementById('all-count').textContent = all.length;

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    document.getElementById('today-panel').innerHTML =
      '<div class="today-date">' + today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() +
      '日 · 星期' + weekdays[today.getDay()] + '</div>' +
      '<div class="today-stats">' +
        '<span>进行中 <b>' + inProgress.length + '</b></span>' +
        '<span>即将截止 <b>' + upcoming.length + '</b></span>' +
      '</div>';
  }

  /* ---------- 日历初始化 ---------- */
  function toEvent(n) {
    const m = TYPE_META[n.type];
    return {
      id: String(n.id),
      title: n.title,
      start: n.start,
      end: n.end ? addDays(n.end, 1) : undefined,
      allDay: true,
      backgroundColor: m.color,
      borderColor: m.color,
      textColor: '#ffffff',
      classNames: ['notice-event', 'type-' + n.type],
      extendedProps: { noticeId: n.id }
    };
  }

  function initCalendar() {
    const el = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(el, {
      locale: 'zh-cn',
      initialView: 'dayGridMonth',
      firstDay: 1,
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,listMonth'
      },
      buttonText: { today: '今天', month: '月', listMonth: '列表' },
      height: 'auto',
      events: notices.map(toEvent),
      displayEventTime: false,
      eventClick: function (info) {
        const n = notices.find(function (x) { return x.id === Number(info.event.extendedProps.noticeId); });
        if (n) showEventDetail(n);
      },
      dateClick: function (info) {
        showDayEvents(info.dateStr);
      },
      eventDidMount: function (info) {
        info.el.title = info.event.title;
      }
    });
    calendar.render();
  }

  renderAll();

  if (typeof FullCalendar !== 'undefined') {
    initCalendar();
  } else {
    document.getElementById('calendar').innerHTML =
      '<p class="empty">日历组件加载失败，请检查网络后刷新页面。下方列表仍可正常查看全部通知。</p>';
  }
  </script>
</body>
</html>
